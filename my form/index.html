<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br>
    <h1>FORM</h1>
    <div>
        <span class="h2">ENTER USERNAME:</span>
        <input type="text">
        <br><br>

        <span class="h3">ENTER EMAIL:</span>
        <input type="text" name="" id="">
        <br><br>

        <span class="h4">ENTER PASSWORD:</span>
        <input type="text" name="" id="">
        <br><br>
        
        <p>SELECT AGE:</p>
        <input type="radio"name="age" id="option1">
        <label for="option1">16-20</label>

        <input type="radio" name="age" id="option2">
         <label for="option2">21-25</label>
         
         
         <input type="radio" name="age" id="option3">
         <label for="option3">26-30</label>
         <br>

         <input type="radio" name="age" id="option4">
         <label for="option4">31-35</label>

         <input type="radio" name="age" id="option5">
         <label for="option5">36-40</label>
         <br><br>

        <span class="h6">ENTER FACULTY:</span>
        <input type="text">
        <br><br>
 
        <span class="department">DEPARTMENT:</span>
            <Select class="le">
                <option value="d1">computer engineering</option>
                <option value="d2">mechanical engineering</option>
                <option value="d3">chemical engineering</option>
                <option value="d4">electrical engineering</option>
                <option value="d5">computer science</option>
            </Select>
            <br><br>


        <span class="level">LEVEL:</span>
            <select class="l0" name="question" id="question">
                <option value="l1">100level</option>
                <option value="l2">200level</option>
                <option value="l3">300level</option>
                <option value="l4">400level</option>
            </select>
            <br><br>
            <button class="button">submit</button>

    
    </div>
    
</body>
</html>
